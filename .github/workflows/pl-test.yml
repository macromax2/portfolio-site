name: P/L regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pl-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка P/L по всем эмитентам
        run: node tests/pl.test.mjs
